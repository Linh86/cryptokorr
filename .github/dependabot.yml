version: 2
updates:
  # Phoenix control plane (Elixir).
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # TypeScript chain adapter.
  - package-ecosystem: npm
    directory: /chain_adapter
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # TypeScript SDK.
  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Front-end assets bundled with Phoenix.
  - package-ecosystem: npm
    directory: /assets
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Python SDK.
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Stdio MCP server (Python).
  - package-ecosystem: pip
    directory: /sdks/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
