# Local staging-like stack for the Bank control plane.
#
# Brings up: Postgres + Phoenix + an adapter stub (placeholder image).
# The adapter itself lives in a separate repo — swap the image tag once a
# published artifact is available. See docs/staging.md for the real
# provisioning plan.
#
# Usage:
#   cp .env.staging.example .env.staging
#   docker compose --env-file .env.staging up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      POSTGRES_DB: ${POSTGRES_DB:-bank_staging}
    volumes:
      - bank_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank} -d ${POSTGRES_DB:-bank_staging}"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    build: .
    image: bank:staging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER:-bank}:${POSTGRES_PASSWORD:-bank}@db/${POSTGRES_DB:-bank_staging}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE required — run `mix phx.gen.secret`}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SERVER: "true"
      PORT: "4000"
      ADAPTER_BASE_URL: ${ADAPTER_BASE_URL:-http://adapter:3000}
      ADAPTER_DISPATCH_SECRET: ${ADAPTER_DISPATCH_SECRET:?ADAPTER_DISPATCH_SECRET required — must match adapter}
      ADAPTER_CALLBACK_SECRET: ${ADAPTER_CALLBACK_SECRET:?ADAPTER_CALLBACK_SECRET required — must match adapter}
    ports:
      - "4000:4000"
    # Run migrations on boot, then start the server.
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]

  adapter:
    # Placeholder image — the real adapter artifact is published from the
    # TypeScript adapter repo. Override with `ADAPTER_IMAGE=...` in
    # .env.staging once that repo publishes a tag.
    image: ${ADAPTER_IMAGE:-ghcr.io/cryptobank/adapter:placeholder}
    environment:
      ADAPTER_DISPATCH_SECRET: ${ADAPTER_DISPATCH_SECRET:?}
      ADAPTER_CALLBACK_SECRET: ${ADAPTER_CALLBACK_SECRET:?}
      PHOENIX_CALLBACK_URL: http://phoenix:4000/internal/adapter/callback
      BUNDLER_URL: ${BUNDLER_URL:-}
      CHAIN: ${CHAIN:-base-sepolia}
    ports:
      - "3000:3000"
    # The adapter image is external to this repo; start policy is
    # "unless-stopped" so a missing image doesn't block `phoenix` on up.
    restart: unless-stopped

volumes:
  bank_pgdata:
