[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cryptokorr-mcp"
version = "0.1.0"
description = "stdio MCP server for CryptoKorr agent tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CryptoKorr" }]
keywords = ["mcp", "model-context-protocol", "cryptokorr", "agent", "stdio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
cryptokorr-mcp = "cryptokorr_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Linh86/cryptokorr"
Source = "https://github.com/Linh86/cryptokorr/tree/main/sdks/mcp"
Documentation = "https://github.com/Linh86/cryptokorr/blob/main/docs/api/mcp-tools.md"
Issues = "https://github.com/Linh86/cryptokorr/issues"
Changelog = "https://github.com/Linh86/cryptokorr/blob/main/sdks/mcp/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptokorr_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cryptokorr_mcp",
  "README.md",
  "CHANGELOG.md",
  "tests",
]
