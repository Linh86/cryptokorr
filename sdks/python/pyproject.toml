[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptokorr"
version = "0.1.0"
description = "Python SDK for the CryptoKorr /v1 API (intents, decisions, audit, operator surface)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "CryptoKorr" },
]
keywords = ["cryptokorr", "sdk", "intents", "agent", "stablecoin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Zero runtime dependencies. The SDK uses stdlib `urllib.request`
# for HTTP, `json` for serialisation, and `os` / `secrets` for
# config + idempotency-key generation. Keeping this list empty is
# intentional — `pip install -e sdks/python` should be trivial and
# free of version-conflict surface for downstream agent builders.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Linh86/cryptokorr"
Source = "https://github.com/Linh86/cryptokorr/tree/main/sdks/python"
Issues = "https://github.com/Linh86/cryptokorr/issues"
Documentation = "https://github.com/Linh86/cryptokorr/tree/main/docs/api"
Changelog = "https://github.com/Linh86/cryptokorr/blob/main/sdks/python/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cryptokorr" = ["py.typed"]
